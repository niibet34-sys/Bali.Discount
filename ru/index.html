<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Экскурсии на Бали — Bali Discount</title>
<style>
:root{--orange:#ff9800;--shadow:0 18px 50px rgba(0,0,0,.18)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.page{position:fixed;inset:0;overflow:hidden;background:#fff}
.notion-frame{position:absolute;left:0;top:-50px;width:100%;height:calc(100% + 50px);border:0;background:#fff}
.contact-wrap{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.contact-menu{width:230px;padding:10px;border-radius:22px;background:rgba(255,255,255,.96);border:1px solid rgba(15,23,42,.08);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;transform:translateY(12px) scale(.97);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.contact-wrap.open .contact-menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.contact-item{width:100%;height:52px;border:0;background:transparent;border-radius:15px;padding:0 10px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:650;color:#111827;text-align:left;cursor:default}
.contact-item+.contact-item{margin-top:3px}
.contact-item:hover{background:#f6f7f8}
.icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;color:#fff;font-weight:800;overflow:hidden}
.icon svg{width:22px;height:22px;display:block;fill:currentColor}
.icon-vk{background:#2787f5;font-size:13px;letter-spacing:-.8px}
.icon-max{background:linear-gradient(145deg,#2a7df5,#7655ff);font-size:18px}
.icon-tg{background:#229ed9}
.icon-wa{background:#25d366}
.fab{width:60px;height:60px;border:0;border-radius:50%;padding:0;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.25);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.fab:active{transform:scale(.96)}
.fab svg{width:31px;height:31px;fill:currentColor}
.fab .close{display:none;font-size:30px;font-weight:300;line-height:1}
.contact-wrap.open .fab .wa{display:none}
.contact-wrap.open .fab .close{display:block}
@media(max-width:520px){.contact-menu{width:min(230px,calc(100vw - 36px))}.contact-wrap{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom))}.fab{width:58px;height:58px}.notion-frame{top:-46px;height:calc(100% + 46px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <iframe class="notion-frame" src="https://balidiscount.notion.site/9d9cc7b88191428a86afbaff8b85931d?pvs=74&embed=1" title="Экскурсии Bali Discount" allow="clipboard-write; fullscreen" loading="eager"></iframe>
</div>

<div class="contact-wrap" id="contactWrap">
  <div class="contact-menu" id="contactMenu" aria-hidden="true">
    <button class="contact-item" type="button" data-messenger="vk">
      <span class="icon icon-vk">VK</span><span>ВКонтакте</span>
    </button>
    <button class="contact-item" type="button" data-messenger="max">
      <span class="icon icon-max">M</span><span>MAX</span>
    </button>
    <button class="contact-item" type="button" data-messenger="telegram">
      <span class="icon icon-tg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 3.4 18.5 19c-.2 1.1-.9 1.4-1.8.9l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.3L6 12.7 1.2 11.2c-1-.3-1-1 .2-1.4L20 2.6c.9-.3 1.9.2 1.7.8Z"/></svg></span><span>Telegram</span>
    </button>
    <button class="contact-item" type="button" data-messenger="whatsapp">
      <span class="icon icon-wa"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.04 3C9.43 3 4.05 8.35 4.05 14.93c0 2.11.56 4.17 1.62 5.97L3.95 27l6.27-1.64a12 12 0 0 0 5.82 1.48h.01c6.61 0 11.99-5.35 11.99-11.93C28.04 8.35 22.66 3 16.04 3Zm0 21.83h-.01a9.98 9.98 0 0 1-5.09-1.39l-.37-.22-3.72.97.99-3.61-.24-.37a9.88 9.88 0 0 1-1.52-5.28c0-5.47 4.47-9.92 9.97-9.92 5.49 0 9.96 4.45 9.96 9.92 0 5.47-4.47 9.9-9.97 9.9Zm5.47-7.42c-.3-.15-1.77-.87-2.04-.97-.28-.1-.48-.15-.68.15-.2.3-.78.97-.95 1.17-.18.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.76-1.66-2.06-.18-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.68-1.64-.93-2.24-.25-.59-.5-.51-.68-.52h-.58c-.2 0-.53.07-.8.37-.28.3-1.05 1.02-1.05 2.49s1.08 2.89 1.23 3.09c.15.2 2.12 3.22 5.14 4.52.72.31 1.28.49 1.72.63.72.23 1.38.2 1.9.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.18-1.42-.08-.13-.28-.2-.58-.35Z"/></svg></span><span>WhatsApp</span>
    </button>
  </div>

  <button class="fab" id="contactToggle" type="button" aria-label="Открыть мессенджеры" aria-expanded="false">
    <svg class="wa" viewBox="0 0 32 32" aria-hidden="true"><path d="M16.04 3C9.43 3 4.05 8.35 4.05 14.93c0 2.11.56 4.17 1.62 5.97L3.95 27l6.27-1.64a12 12 0 0 0 5.82 1.48h.01c6.61 0 11.99-5.35 11.99-11.93C28.04 8.35 22.66 3 16.04 3Zm0 21.83h-.01a9.98 9.98 0 0 1-5.09-1.39l-.37-.22-3.72.97.99-3.61-.24-.37a9.88 9.88 0 0 1-1.52-5.28c0-5.47 4.47-9.92 9.97-9.92 5.49 0 9.96 4.45 9.96 9.92 0 5.47-4.47 9.9-9.97 9.9Zm5.47-7.42c-.3-.15-1.77-.87-2.04-.97-.28-.1-.48-.15-.68.15-.2.3-.78.97-.95 1.17-.18.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.76-1.66-2.06-.18-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.68-1.64-.93-2.24-.25-.59-.5-.51-.68-.52h-.58c-.2 0-.53.07-.8.37-.28.3-1.05 1.02-1.05 2.49s1.08 2.89 1.23 3.09c.15.2 2.12 3.22 5.14 4.52.72.31 1.28.49 1.72.63.72.23 1.38.2 1.9.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.18-1.42-.08-.13-.28-.2-.58-.35Z"/></svg>
    <span class="close" aria-hidden="true">×</span>
  </button>
</div>

<script>
const wrap=document.getElementById('contactWrap');
const toggle=document.getElementById('contactToggle');
const menu=document.getElementById('contactMenu');
function setOpen(open){wrap.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-hidden',String(!open));}
toggle.addEventListener('click',e=>{e.stopPropagation();setOpen(!wrap.classList.contains('open'));});
menu.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>setOpen(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false);});
document.querySelectorAll('[data-messenger]').forEach(btn=>btn.addEventListener('click',e=>e.preventDefault()));
</script>
</body>
</html>
