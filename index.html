<!doctype html>
<html lang="en">

<meta name="description" content="Private Bali tours at group-tour prices. Choose your language and explore Bali with a private guide.">
<title>Bali Discount — Private Tours in Bali</title>

<style>
:root{--orange:#ff9800;--orange-2:#ffb845;--cream:#fff8ef;--line:rgba(255,255,255,.18);--text-soft:rgba(255,255,255,.88)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#091412}body{color:#fff;font-family:"Manrope",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#091412}a{color:inherit;text-decoration:none}
.hero{min-height:100svh;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(4,8,7,.01) 0%,rgba(4,8,7,.03) 24%,rgba(4,8,7,.10) 50%,rgba(4,8,7,.26) 76%,rgba(4,8,7,.48) 100%),url("./assets/bali-road-bg.webp") center center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 8%,rgba(255,215,145,.08),transparent 23%);z-index:-1;pointer-events:none}
.shell{width:min(100%,560px);min-height:100svh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{padding-top:8px;display:flex;flex-direction:column;align-items:center}.logo{width:112px;height:112px;object-fit:cover;border-radius:50%;clip-path:circle(49% at 50% 50%);display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.34));transform:scale(1.01);transform-origin:center}
.main{margin:auto 0;text-align:center;padding:24px 0 16px;transform:translateY(-38px)}.kicker{margin:0 0 12px;font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.86);font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.42)}
h1{margin:0;font-family:"Italiana",Georgia,"Times New Roman",serif;font-size:clamp(3.25rem,16vw,5.45rem);line-height:.86;letter-spacing:-.032em;font-weight:400;text-shadow:0 5px 22px rgba(0,0,0,.48);text-wrap:balance}h1 em{display:block;font-style:normal;font-weight:400;color:var(--cream);letter-spacing:-.022em;font-size:.90em}
.promise{margin:18px 0 0;color:#ffe1a8;text-transform:uppercase;font-weight:700;letter-spacing:.115em;font-size:clamp(.84rem,3.7vw,.98rem);text-shadow:0 3px 12px rgba(0,0,0,.50)}
.micro{margin:14px auto 0;max-width:21rem;color:var(--text-soft);font-family:"Manrope",sans-serif;font-size:.93rem;line-height:1.48;font-weight:400;letter-spacing:.005em;text-shadow:0 2px 10px rgba(0,0,0,.48)}
.rule{width:58px;height:1px;margin:17px auto 20px;border-radius:999px;background:linear-gradient(90deg,var(--orange),#ffd8a2);box-shadow:0 0 18px rgba(255,152,0,.35)}
.label{margin:0 0 11px;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.88);font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.4)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.lang{min-height:50px;padding:9px 13px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(9,17,15,.36),rgba(5,11,10,.27));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 18px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.04);font-weight:600;font-size:.93rem;letter-spacing:.004em;text-shadow:0 1px 5px rgba(0,0,0,.35)}
.lang--primary{border-color:rgba(255,178,87,.70);background:linear-gradient(180deg,rgba(94,49,8,.40),rgba(29,19,8,.30));box-shadow:0 10px 24px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.05)}.lang--full{grid-column:1/-1;width:calc(50% - 4.5px);justify-self:center}.flag{font-size:1.18rem;line-height:1}
.bottom{display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:4px}.villas{display:flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border-radius:999px;background:rgba(4,10,8,.40);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,.95);font-size:.84rem;font-weight:500;text-shadow:0 1px 5px rgba(0,0,0,.35)}.villas b{color:#fff;font-weight:600}.arr{color:#ffd08b;font-size:1.05rem;margin-left:3px}
.whatsapp{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(86px,calc(env(safe-area-inset-bottom) + 18px));width:58px;height:58px;border:0;padding:0;border-radius:50%;background:transparent;box-shadow:0 10px 26px rgba(0,0,0,.28);display:block;z-index:10;transition:transform .18s ease,filter .18s ease}.whatsapp:hover,.whatsapp:focus-visible{transform:translateY(-2px) scale(1.03);filter:brightness(1.03);outline:none}.whatsapp svg{display:block;width:58px;height:58px}
@media(max-height:760px) and (max-width:759px){.logo{width:96px;height:96px}.main{padding:12px 0 8px;transform:translateY(-26px)}h1{font-size:2.96rem}.promise{margin-top:11px;font-size:.80rem}.micro{margin-top:9px;font-size:.80rem;line-height:1.34}.rule{margin:11px auto 13px}.lang{min-height:44px;font-size:.85rem}.bottom{gap:10px}.whatsapp,.whatsapp svg{width:54px;height:54px}.whatsapp{bottom:max(78px,calc(env(safe-area-inset-bottom) + 16px))}}
@media(min-width:760px){.shell{width:min(100%,740px);padding-left:28px;padding-right:28px}.logo{width:124px;height:124px}.main{max-width:680px;align-self:center;transform:translateY(-20px)}h1 em{display:inline}.grid{grid-template-columns:repeat(5,1fr)}.lang--full{grid-column:auto;width:auto;justify-self:auto}.whatsapp{bottom:max(18px,env(safe-area-inset-bottom))}}
</style>
</head>
