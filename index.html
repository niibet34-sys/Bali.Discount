<style>
:root{--orange:#ff9800;--orange-2:#ffb845;--cream:#fff8ef;--line:rgba(255,255,255,.18);--panel:rgba(6,13,12,.42);--panel-2:rgba(5,10,9,.62);--text-soft:rgba(255,255,255,.78)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#091412}body{color:#fff;font-family:"Manrope",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#091412}a{color:inherit;text-decoration:none}
.hero{min-height:100svh;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(5,10,9,.08) 0%,rgba(6,12,11,.18) 24%,rgba(5,10,9,.52) 60%,rgba(4,8,7,.94) 100%),url("https://images.pexels.com/photos/36653750/pexels-photo-36653750.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1600&h=2400") center 42%/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 16%,rgba(255,173,70,.18),transparent 22%),linear-gradient(90deg,rgba(0,0,0,.10),transparent 24%,transparent 76%,rgba(0,0,0,.12));z-index:-1}
.shell{width:min(100%,560px);min-height:100svh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{padding-top:8px;display:flex;flex-direction:column;align-items:center}.logo{width:112px;height:112px;object-fit:cover;border-radius:50%;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.34));transform:scale(1.01);transform-origin:center}

h1{margin:0;font-family:"Italiana",Georgia,"Times New Roman",serif;font-size:clamp(3.45rem,17vw,5.8rem);line-height:.84;letter-spacing:-.035em;font-weight:400;text-shadow:0 8px 24px rgba(0,0,0,.30);text-wrap:balance}h1 em{display:block;font-style:normal;font-weight:400;color:var(--cream);letter-spacing:-.025em;font-size:.90em}
.promise{margin:19px 0 0;color:#ffd08b;text-transform:uppercase;font-weight:600;letter-spacing:.12em;font-size:clamp(.84rem,3.7vw,.98rem);text-shadow:0 4px 14px rgba(0,0,0,.28)}
.micro{margin:15px auto 0;max-width:22rem;color:var(--text-soft);font-family:"Manrope",sans-serif;font-size:.94rem;line-height:1.5;font-weight:400;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.28)}
.rule{width:58px;height:1px;margin:18px auto 22px;border-radius:999px;background:linear-gradient(90deg,var(--orange),#ffd8a2);box-shadow:0 0 18px rgba(255,152,0,.35)}
.label{margin:0 0 12px;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang{min-height:54px;padding:11px 14px;border-radius:17px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(16,25,23,.50),rgba(7,13,12,.38));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.04);font-weight:600;font-size:.94rem;letter-spacing:.004em}
.lang--primary{border-color:rgba(255,164,63,.72);background:linear-gradient(180deg,rgba(88,46,8,.52),rgba(26,18,9,.42));box-shadow:0 12px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05)}.lang--full{grid-column:1/-1;width:calc(50% - 5px);justify-self:center}.flag{font-size:1.2rem;line-height:1}
.bottom{display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:4px}.villas{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(4,10,8,.44);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,.90);font-size:.83rem;font-weight:500}.villas b{color:#fff;font-weight:600}.vicon{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:.8rem;flex:0 0 auto}.arr{color:#ffc672;font-size:1rem;margin-left:2px}
.whatsapp{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;border:1px solid rgba(255,255,255,.42);box-shadow:0 12px 28px rgba(0,0,0,.30);display:grid;place-items:center;z-index:10}.whatsapp svg{width:27px;height:27px;fill:currentColor}
@media(max-height:760px) and (max-width:759px){.logo{width:96px;height:96px}.main{padding:13px 0 9px}h1{font-size:3.12rem}.promise{margin-top:12px;font-size:.80rem}.micro{margin-top:10px;font-size:.82rem;line-height:1.38}.rule{margin:12px auto 14px}.lang{min-height:46px;font-size:.86rem}.bottom{gap:10px}}
@media(min-width:760px){.shell{width:min(100%,740px);padding-left:28px;padding-right:28px}.logo{width:124px;height:124px}.main{max-width:680px;align-self:center}h1 em{display:inline}.grid{grid-template-columns:repeat(5,1fr)}.lang--full{grid-column:auto;width:auto;justify-self:auto}}
</style>
</head>
