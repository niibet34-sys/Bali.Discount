<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091412">
<meta name="description" content="Private Bali tours at group-tour prices. Choose your language and explore Bali with a private guide.">
<title>Bali Discount — Private Tours in Bali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff9800;--orange-2:#ffb845;--cream:#fff8ef;--line:rgba(255,255,255,.18);--panel:rgba(6,13,12,.42);--panel-2:rgba(5,10,9,.62);--text-soft:rgba(255,255,255,.84)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#091412}body{color:#fff;font-family:"Manrope",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#091412}a{color:inherit;text-decoration:none}
.hero{min-height:100svh;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(4,8,7,.01) 0%,rgba(4,8,7,.03) 24%,rgba(4,8,7,.10) 50%,rgba(4,8,7,.26) 76%,rgba(4,8,7,.48) 100%),url("./assets/bali-road-bg.webp") center center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 8%,rgba(255,215,145,.08),transparent 23%);z-index:-1;pointer-events:none}
.shell{width:min(100%,560px);min-height:100svh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{padding-top:8px;display:flex;flex-direction:column;align-items:center}.logo{width:112px;height:112px;object-fit:cover;border-radius:50%;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.34));transform:scale(1.01);transform-origin:center}
.main{margin:auto 0;text-align:center;padding:24px 0 16px}.kicker{margin:0 0 13px;font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.82);font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.42)}
h1{margin:0;font-family:"Italiana",Georgia,"Times New Roman",serif;font-size:clamp(3.45rem,17vw,5.8rem);line-height:.84;letter-spacing:-.035em;font-weight:400;text-shadow:0 5px 22px rgba(0,0,0,.48);text-wrap:balance}h1 em{display:block;font-style:normal;font-weight:400;color:var(--cream);letter-spacing:-.025em;font-size:.90em}
.promise{margin:19px 0 0;color:#ffd08b;text-transform:uppercase;font-weight:600;letter-spacing:.12em;font-size:clamp(.84rem,3.7vw,.98rem);text-shadow:0 3px 12px rgba(0,0,0,.48)}
.micro{margin:15px auto 0;max-width:22rem;color:var(--text-soft);font-family:"Manrope",sans-serif;font-size:.94rem;line-height:1.5;font-weight:400;letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.46)}
.rule{width:58px;height:1px;margin:18px auto 22px;border-radius:999px;background:linear-gradient(90deg,var(--orange),#ffd8a2);box-shadow:0 0 18px rgba(255,152,0,.35)}
.label{margin:0 0 12px;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.84);font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.4)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang{min-height:54px;padding:11px 14px;border-radius:17px;border:1px solid rgba(255,255,255,.24);background:linear-gradient(180deg,rgba(9,17,15,.44),rgba(5,11,10,.34));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.05);font-weight:600;font-size:.94rem;letter-spacing:.004em;text-shadow:0 1px 5px rgba(0,0,0,.35)}
.lang--primary{border-color:rgba(255,164,63,.82);background:linear-gradient(180deg,rgba(94,49,8,.50),rgba(29,19,8,.39));box-shadow:0 12px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.06)}.lang--full{grid-column:1/-1;width:calc(50% - 5px);justify-self:center}.flag{font-size:1.2rem;line-height:1}
.bottom{display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:4px}.villas{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(4,10,8,.42);border:1px solid rgba(255,255,255,.20);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,.94);font-size:.83rem;font-weight:500;text-shadow:0 1px 5px rgba(0,0,0,.35)}.villas b{color:#fff;font-weight:600}.vicon{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:.8rem;flex:0 0 auto}.arr{color:#ffc672;font-size:1rem;margin-left:2px}
.whatsapp{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:58px;height:58px;border:0;padding:0;border-radius:50%;background:transparent;box-shadow:0 10px 26px rgba(0,0,0,.28);display:block;z-index:10;transition:transform .18s ease,filter .18s ease}.whatsapp:hover,.whatsapp:focus-visible{transform:translateY(-2px) scale(1.03);filter:brightness(1.03);outline:none}.whatsapp svg{display:block;width:58px;height:58px}
@media(max-height:760px) and (max-width:759px){.logo{width:96px;height:96px}.main{padding:13px 0 9px}h1{font-size:3.12rem}.promise{margin-top:12px;font-size:.80rem}.micro{margin-top:10px;font-size:.82rem;line-height:1.38}.rule{margin:12px auto 14px}.lang{min-height:46px;font-size:.86rem}.bottom{gap:10px}.whatsapp,.whatsapp svg{width:54px;height:54px}}
@media(min-width:760px){.shell{width:min(100%,740px);padding-left:28px;padding-right:28px}.logo{width:124px;height:124px}.main{max-width:680px;align-self:center}h1 em{display:inline}.grid{grid-template-columns:repeat(5,1fr)}.lang--full{grid-column:auto;width:auto;justify-self:auto}}
</style>
</head>
<body>
<main class="hero"><section class="shell" aria-label="Bali Discount">
<header class="top"><img class="logo" src="./assets/bali-discount-logo.webp" alt="Bali Discount logo" width="224" height="224"></header>
<section class="main"><p class="kicker">Bali · Private experiences</p><h1>Private tours <em>in Bali.</em></h1><p class="promise">At group-tour prices</p><p class="micro">Private tours in Bali with guides in your language.</p><div class="rule" aria-hidden="true"></div><p class="label">Choose your language</p><div class="grid">

</div></section>

</section>

</body></html>
